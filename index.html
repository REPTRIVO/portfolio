function vPick(){app.innerHTML='<div class="in">'+hero()+'<div class="who"><h2 style="margin:0">'+t('pickEx')+'</h2><button class="link" data-act="split">'+t('chSplit')+'</button></div><div class="chips" id="dc"></div><input id="qs" type="search" placeholder="'+t('search')+'" style="width:100%;margin-bottom:10px"><div class="chips" id="gc"></div><div id="pl"></div><div style="height:70px"></div></div><div class="bottom" id="bt"></div>';pickAll()}
function pickAll(){
 document.getElementById('dc').innerHTML=D.map((d,i)=>'<button class="chip" data-di="'+i+'" aria-pressed="'+(i===di)+'">'+esc(d.n)+' ('+d.e.length+')</button>').join('');
 document.getElementById('gc').innerHTML=[['rec',t('rec')],['all',t('all')]].concat(G.map(g=>[g,gl(g)])).map(x=>'<button class="chip" data-g="'+x[0]+'" aria-pressed="'+(x[0]===fg)+'">'+x[1]+'</button>').join('');
 pickList();bottom()}
function pickList(){
 const d=D[di],sel=d.e,qq=q.trim().toLowerCase();
 let gs=qq||fg==='all'?G:fg==='rec'?(REC[d.n]||G):[fg],h='';
 gs.forEach(g=>{const l=CAT[g].filter(x=>!qq||x.toLowerCase().includes(qq));
  if(l.length)h+='<div class="gh">'+gl(g)+'</div>'+l.map(x=>'<div class="ex'+(sel.includes(x)?' on':'')+'" data-x="'+esc(x)+'">'+esc(x)+'<span>'+(sel.includes(x)?'✓':'+')+'</span></div>').join('')});
 document.getElementById('pl').innerHTML=h||'<p class="empty">'+t('none')+'</p>'}
function bottom(){const n=D.reduce((a,d)=>a+d.e.length,0);document.getElementById('bt').innerHTML='<button class="big" data-done'+(n?'':' disabled')+'>'+t('done')+' ('+n+' '+t('exN')+')</button>'}
function done(){const p=D.filter(d=>d.e.length).map(d=>({n:d.n,e:d.e}));if(!p.length){toast(t('needex'));return}
 S.program=p;dP=true;schedule();if(!p.some(d=>d.n===cur))cur=p[0].n;view='main';render()}

function hasData(c){return [...c.querySelectorAll('.sets .set')].some(r=>num(r.querySelector('.w').value)!==null&&num(r.querySelector('.r').value)!==null)}
function updProg(){const cs=document.querySelectorAll('.card[data-ex]'),n=document.querySelectorAll('.card.ok').length,f=document.getElementById('pbf'),x=document.getElementById('pbt');if(!f)return;f.style.width=(cs.length?n/cs.length*100:0)+'%';x.textContent=n+' / '+cs.length+' '+t('exN')}
function dateLine(){try{return new Date().toLocaleDateString(lang==='fi'?'fi-FI':'en-GB',{weekday:'long',day:'numeric',month:'long'})}catch(e){return ''}}
function wk(d){const p=d.split('-'),t0=Date.UTC(+p[0],+p[1]-1,+p[2]),dow=(new Date(t0).getUTCDay()+6)%7;return Math.floor((t0-dow*864e5)/6048e5)}
function streak(){
 const w=[...new Set(S.sessions.map(x=>wk(x.date)))].sort((a,b)=>a-b),now=wk(today());
 if(!w.length)return{cur:0,best:0,tw:0};
 let best=1,run=1;for(let i=1;i<w.length;i++){run=w[i]===w[i-1]+1?run+1:1;if(run>best)best=run}
 let cur=0,x=w.includes(now)?now:now-1;while(w.includes(x)){cur++;x--}
 return{cur:cur,best:best,tw:S.sessions.filter(y=>wk(y.date)===now).length}}
function streakHtml(){const k=streak(),fl='<svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor" aria-hidden="true"><path d="M12 2c.5 3.5 4.5 5.5 4.5 10a4.5 4.5 0 0 1-9 0c0-1.8.8-3 1.8-4 .3 1.2.9 1.8 1.7 2C10.2 7.5 11 5 12 2z"/></svg>';
 return '<div class="stats"><div class="stat"><small>'+t('streakT')+'</small><strong><span class="fl">'+fl+'</span> '+k.cur+' '+t('wkU')+'</strong></div><div class="stat"><small>'+t('bestT')+'</small><strong>'+k.best+' '+t('wkU')+'</strong></div><div class="stat"><small>'+t('thisWk')+'</small><strong>'+k.tw+' '+t('wos')+'</strong></div></div>'}
function renderLog(){
 if(!S.program.some(d=>d.n===cur))cur=S.program[0].n;
 const idx=S.program.findIndex(d=>d.n===cur),day=S.program[idx];
 const nc=S.program.length<=4?S.program.length:Math.ceil(S.program.length/2);
 let h=hero()+'<div class="who"><button class="link" data-act="edit">'+t('editProg')+'</button><button class="link" data-act="out">'+t('logout')+'</button></div><div class="chips g" style="grid-template-columns:repeat('+nc+',1fr)">'+
 S.program.map((d,i)=>'<button class="chip" data-w="'+esc(d.n)+'" aria-pressed="'+(d.n===cur)+'"><span class="ci">'+svg(ICS[i%4])+'</span><span class="cl">'+esc(d.n)+'</span></button>').join('')+'</div>'+
 '<div class="pw"><div class="pbar"><i id="pbf"></i></div><span id="pbt"></span></div><div class="row"><label for="dt" style="color:var(--mute)">'+t('day')+'</label><input type="date" id="dt" value="'+curDate+'"></div>';
 day.e.forEach((ex,ii)=>{
  const cs=S.sessions.find(s=>s.date===curDate&&s.workout===cur);
  const hs=hist(ex).filter(x=>!cs||x.id!==cs.id),last=hs.length?hs[hs.length-1].sets:null,g=S.goals[ex];
  const mine=cs&&cs.entries.find(x=>x.ex===ex);
  const sets=(mine?mine.sets:(last&&last.length?last:[{w:'',r:''},{w:'',r:''}])).slice();
  h+='<section class="card'+(mine?' ok':'')+'" style="--i:'+ii+'" data-ex="'+esc(ex)+'"'+(mine?' data-dirty="1"':'')+'><div class="eh"><i>'+svg(ICS[idx%4])+'</i><h3>'+esc(ex)+'</h3><span class="chk">'+svg('<path d="M5 12l5 5L20 7"/>')+'</span></div><p class="hint">'+(last?t('last')+setTxt(last):t('noLog'))+
  '</p><div class="sets">'+
  sets.map((s,i)=>setRow(i+1,s.w,s.r)).join('')+'</div><button class="link" data-add>'+t('addSet')+'</button>'+'</section>';
 });
 h+='<p class="hint" id="st" style="text-align:center">'+t('auto')+'</p>';
 app.innerHTML=h;updProg();
}
function setRow(n,w,r){return '<div class="set"><b>'+n+'</b><input class="w" inputmode="decimal" value="'+(w===''?'':f(w))+'" aria-label="'+t('wt')+'"><em>kg ×</em><input class="r" inputmode="numeric" value="'+r+'" aria-label="'+t('rp')+'"><em>'+t('reps')+'</em></div>'}
function autosave(){
 const entries=[];
 document.querySelectorAll('.card[data-ex]').forEach(c=>{
  const ex=c.dataset.ex,sets=[];
  if(c.dataset.dirty){c.querySelectorAll('.sets .set').forEach(r=>{const w=num(r.querySelector('.w').value),n=num(r.querySelector('.r').value);if(w!==null&&n!==null)sets.push({w:w,r:Math.round(n)})});if(sets.length)entries.push({ex:ex,sets:sets})}
 });
 const id=skey(curDate,cur),cs=S.sessions.find(x=>x.id===id);
 if(entries.length){if(cs)cs.entries=entries;else S.sessions.push({id:id,date:curDate,workout:cur,ts:Date.now(),entries:entries});dS.add(id)}
 else if(cs){S.sessions=S.sessions.filter(x=>x!==cs);dS.add(id)}
 updProg();
 schedule();
}
function chart(p){
 const Wd=600,H=250,l=44,r=24,tp=30,b=34;
 const vals=p.map(x=>x.w);let mn=Math.min(...vals),mx=Math.max(...vals);
 if(mn===mx){mn-=2.5;mx+=2.5}else{const pad=(mx-mn)*.2;mn-=pad;mx+=pad}
 const X=i=>p.length===1?(l+Wd-r)/2:l+i*(Wd-l-r)/(p.length-1),Y=v=>tp+(H-tp-b)*(1-(v-mn)/(mx-mn));
 let s='<svg class="ch" viewBox="0 0 '+Wd+' '+H+'" role="img" aria-label="'+t('chartAria')+'"><defs><linearGradient id="ag" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:var(--ac);stop-opacity:.35"/><stop offset="1" style="stop-color:var(--ac);stop-opacity:0"/></linearGradient></defs>';
 for(let i=0;i<4;i++){const v=mn+(mx-mn)*i/3,y=Y(v);s+='<line class="g" x1="'+l+'" x2="'+(Wd-r)+'" y1="'+y+'" y2="'+y+'"/><text class="tx" x="'+(l-8)+'" y="'+(y+4)+'" text-anchor="end">'+f(Math.round(v*10)/10)+'</text>'}
 s+='<path class="ar" fill="url(#ag)" d="M'+X(0)+','+(H-b)+' L'+p.map((x,i)=>X(i)+','+Y(x.w)).join(' L')+' L'+X(p.length-1)+','+(H-b)+'Z"/><path class="ln" pathLength="1" d="M'+p.map((x,i)=>X(i)+','+Y(x.w)).join(' L')+'"/>';
 const max=Math.max(...vals),step=Math.ceil(p.length/6);
 p.forEach((x,i)=>{
  s+='<circle class="dot'+(x.w===max&&p.length>1?' pb':'')+'" cx="'+X(i)+'" cy="'+Y(x.w)+'" r="5"/>';
  if(p.length<=8||i===p.length-1)s+='<text class="vl" x="'+X(i)+'" y="'+(Y(x.w)-12)+'" text-anchor="middle">'+f(x.w)+'</text>';
  if(i%step===0||i===p.length-1)s+='<text class="tx" x="'+X(i)+'" y="'+(H-10)+'" text-anchor="middle">'+fs(x.date)+'</text>';
 });
 return s+'</svg>';
}
const dl=(v,u)=>{v=Math.round(v*100)/100;return v>0?'▲ +'+f(v)+u:v<0?'▼ '+f(v)+u:'▬ 0'+u};
const dcls=v=>v>0?'up':v<0?'dn':'eq';
const lg=K=>'<div class="lg">'+Array.from({length:K},(_,k)=>'<span><i class="k'+Math.min(k,3)+'"></i>'+t('setN')+' '+(k+1)+'</span>').join('')+'</div>';
function multi(hs,fl){
 const n=hs.length,K=Math.max(...hs.map(x=>x.sets.length)),Wd=600,H=250,l=44,r=30,tp=26,b=34;
 const all=[];hs.forEach(x=>x.sets.forEach(q=>all.push(q[fl])));
 let mn=Math.min(...all),mx=Math.max(...all);
 if(mn===mx){const e=fl==='w'?2.5:1;mn-=e;mx+=e}else{const pad=(mx-mn)*.25;mn-=pad;mx+=pad}
 if(fl==='r'&&mn<0)mn=0;
 const X=i=>n===1?(l+Wd-r)/2:l+i*(Wd-l-r)/(n-1),Y=v=>tp+(H-tp-b)*(1-(v-mn)/(mx-mn));
 let s='<svg class="ch" viewBox="0 0 '+Wd+' '+H+'" role="img" aria-label="'+t('chartAria')+'">';
 for(let i=0;i<4;i++){const v=mn+(mx-mn)*i/3,y=Y(v);s+='<line class="g" x1="'+l+'" x2="'+(Wd-r)+'" y1="'+y+'" y2="'+y+'"/><text class="tx" x="'+(l-8)+'" y="'+(y+4)+'" text-anchor="end">'+(fl==='w'?f(Math.round(v*10)/10):Math.round(v))+'</text>'}
 for(let k=K-1;k>=0;k--){
  const c=Math.min(k,3),pts=[];hs.forEach((x,i)=>{if(x.sets[k])pts.push({i:i,v:x.sets[k][fl]})});
  if(!pts.length)continue;
  s+='<path class="ml ls'+c+'" d="M'+pts.map(q=>X(q.i)+','+Y(q.v)).join(' L')+'"/>';
  pts.forEach((q,j)=>{s+='<circle class="md ds'+c+'" cx="'+X(q.i)+'" cy="'+Y(q.v)+'" r="4.5"/>';
   if(j===pts.length-1||pts.length<=4)s+='<text class="vl" x="'+X(q.i)+'" y="'+(Y(q.v)+(k%2?20:-11))+'" text-anchor="middle">'+(fl==='w'?f(q.v):q.v)+'</text>'})}
 const step=Math.ceil(n/6);
 hs.forEach((x,i)=>{if(i%step===0||i===n-1)s+='<text class="tx" x="'+X(i)+'" y="'+(H-10)+'" text-anchor="middle">'+fs(x.date)+'</text>'});
 return s+'</svg>'}
function renderProg(){
 const inP=new Set();let opts='';
 S.program.forEach(d=>{opts+='<optgroup label="'+esc(d.n)+'">'+d.e.map(e=>{inP.add(e);return '<option value="'+esc(e)+'">'+esc(e)+'</option>'}).join('')+'</optgroup>'});
 const oth=[...new Set(S.sessions.flatMap(x=>x.entries.map(e=>e.ex)))].filter(e=>!inP.has(e));
 if(oth.length)opts+='<optgroup label="'+t('other')+'">'+oth.map(e=>'<option value="'+esc(e)+'">'+esc(e)+'</option>').join('')+'</optgroup>';
 if(!inP.has(pex)&&!oth.includes(pex))pex=S.program[0].e[0];
 const hs=hist(pex),wtop=x=>Math.max(...x.sets.map(q=>q.w));
 let h=hero()+'<h2>'+t('prog')+'</h2><div class="row"><select id="sel" aria-label="'+t('ex')+'">'+opts+'</select></div>';
 if(!hs.length)h+='<div class="empty">'+svg(ICS[0]).replace('class="ico"','class="ico big2"')+'<p>'+t('noEx')+'</p></div>';
 else{
  const K=Math.max(...hs.map(x=>x.sets.length)),bestW=Math.max(...hs.map(wtop)),pr=hs.findIndex(x=>wtop(x)===bestW);
  h+='<div class="card"><h3 style="margin-bottom:8px">'+t('wt')+' (kg)</h3>'+lg(K)+multi(hs,'w')+'</div>'+
  '<div class="card"><h3 style="margin-bottom:8px">'+t('rp')+'</h3>'+lg(K)+multi(hs,'r')+'</div>';
  let ps='';
  for(let k=0;k<K;k++){
   const a=hs.find(x=>x.sets[k]),z=hs.slice().reverse().find(x=>x.sets[k]);if(!a)continue;
   const A=a.sets[k],Z=z.sets[k],dw=Z.w-A.w,dr=Z.r-A.r;
   ps+='<div class="sr"><b>'+t('setN')+' '+(k+1)+'</b><span>'+f(A.w)+' kg × '+A.r+' → '+f(Z.w)+' kg × '+Z.r+'</span><div><span class="df '+dcls(dw)+'">'+dl(dw,' kg')+'</span><span class="df '+dcls(dr)+'">'+dl(dr,' '+t('reps'))+'</span></div></div>'}
  h+='<div class="card"><h3 style="margin-bottom:4px">'+t('perSet')+'</h3>'+ps+'</div>';
  h+='<div class="card"><h3 style="margin-bottom:6px">'+t('logs')+'</h3>'+hs.map((x,i)=>{const pv=hs[i-1];
   return '<div class="hist2"><div class="hh"><strong>'+fd(x.date)+(i===pr&&hs.length>1?' <span class="pr">PR</span>':'')+'</strong><button class="del" data-del="'+esc(x.id)+'">'+t('rm')+'</button></div>'+
   x.sets.map((q,k)=>{const o=pv&&pv.sets[k];
    return '<div class="rw"><b>'+(k+1)+'</b><span>'+f(q.w)+' kg × '+q.r+'</span>'+(o?'<span class="df '+dcls(q.w-o.w)+'">'+dl(q.w-o.w,' kg')+'</span><span class="df '+dcls(q.r-o.r)+'">'+dl(q.r-o.r,' '+t('reps'))+'</span>':'')+'</div>'}).join('')+'</div>'}).reverse().join('')+'</div>';
 }
 app.innerHTML=h;
 const sl=document.getElementById('sel');if(sl)sl.value=pex;
}
const views={auth:vAuth,load:vLoad,err:vErr,split:vSplit,custom:vCustom,pick:vPick,main:()=>tab==='log'?renderLog():renderProg()};
function render(){document.body.classList.toggle('m',view==='main');
 document.getElementById('t-log').setAttribute('aria-current',tab==='log');document.getElementById('t-prog').setAttribute('aria-current',tab==='prog');
 document.getElementById('n1').textContent=t('wo');document.getElementById('n2').textContent=t('prog');document.documentElement.lang=lang;
 views[view]();window.scrollTo(0,0)}

app.addEventListener('click',e=>{
 const t=e.target.closest('button,.ex');if(!t)return;const d=t.dataset;
 if('lang' in d){keepForm();lang=d.lang;Ls('reptrivo2-lang',lang);render()}
 else if('go' in d)auth();
 else if('mode2' in d){keepForm();mode=d.mode2;amsg='';vAuth()}
 else if('retry' in d)enter(curUser);
 else if('sp' in d){
  const mk=n=>{const o=(S.program||[]).find(x=>x.n===n);return{n:n,e:o?o.e.slice():[]}};
  if(d.sp==='c'){D=(S.program||[]).map(x=>mk(x.n));view='custom'}else{D=SPLITS[+d.sp][1].map(mk);di=0;fg='rec';q='';view='pick'}render()}
 else if('sug' in d)addDay(d.sug);
 else if('addday' in d)addDay(document.getElementById('dn').value);
 else if('rm' in d){D.splice(+d.rm,1);vCustom()}
 else if('next' in d){if(!D.length){toast(tx('needday'));return}di=0;fg='rec';q='';view='pick';render()}
 else if('di' in d){di=+d.di;pickAll()}
 else if('g' in d){fg=d.g;pickAll()}
 else if('x' in d){const a=D[di].e,i=a.indexOf(d.x);if(i<0)a.push(d.x);else a.splice(i,1);pickAll()}
 else if('done' in d)done();
 else if(d.act==='edit'){D=S.program.map(x=>({n:x.n,e:x.e.slice()}));di=0;fg='all';q='';view='pick';render()}
 else if(d.act==='split'){view='split';render()}
 else if(d.act==='out')logout();
 else if('w' in d){cur=d.w;renderLog()}
 else if('add' in d){const box=t.previousElementSibling,n=box.children.length+1,last=box.lastElementChild;
  const lw=last?last.querySelector('.w').value:'',lr=last?last.querySelector('.r').value:'';
  box.insertAdjacentHTML('beforeend',setRow(n,'',''));const nr=box.lastElementChild;nr.querySelector('.w').value=lw;nr.querySelector('.r').value=lr;box.closest('.card').dataset.dirty='1';autosave()}
 else if('pm' in d){pm=d.pm;renderProg()}
 else if('del' in d){
  if(!t.classList.contains('sure')){t.classList.add('sure');t.textContent=tx('sure');return}
  const id=d.del;dS.add(id);S.sessions.forEach(s=>{if(s.id===id)s.entries=s.entries.filter(x=>x.ex!==pex)});
  S.sessions=S.sessions.filter(s=>s.entries.length);schedule();renderProg()}
});
app.addEventListener('change',e=>{if(e.target.id==='sel'){pex=e.target.value;renderProg()}else if(e.target.id==='dt'){curDate=e.target.value||today();renderLog()}});
app.addEventListener('input',e=>{
 if(e.target.id==='qs'){q=e.target.value;pickList();return}
 const c=e.target.closest('.card[data-ex]');if(!c)return;
 if(e.target.classList.contains('w')||e.target.classList.contains('r')){c.dataset.dirty='1';pex=c.dataset.ex;c.classList.toggle('ok',hasData(c))}autosave()});
app.addEventListener('keydown',e=>{if(e.key==='Enter'&&['em','un','pw','pw2'].includes(e.target.id))auth();if(e.key==='Enter'&&e.target.id==='dn')addDay(e.target.value)});
document.getElementById('t-log').onclick=()=>{tab='log';render()};
document.getElementById('t-prog').onclick=()=>{tab='prog';render();flush()};
view='load';render();init();
</script>
